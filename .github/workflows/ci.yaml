name: ci
on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - main
jobs:
  test-member:
    runs-on: ubuntu-latest
    env:
      BATON_LOG_LEVEL: debug
      BATON_TOKEN: "${{ secrets.BATON_TOKEN }}"
      BATON_ENTERPRISE_TOKEN: "${{ secrets.BATON_ENTERPRISE_TOKEN }}"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build baton-slack-enterprise
        run: go build ./cmd/baton-slack-enterprise
      - name: Test member workspace role sync and provisioning
        uses: ConductorOne/github-workflows/actions/sync-test@v4
        with:
          connector: ./baton-slack-enterprise
          baton-entitlement: "${{ vars.WORKSPACE_ROLE_MEMBER_ENTITLEMENT }}"
          baton-principal: "${{ vars.WORKSPACE_ROLE_MEMBER_PRINCIPAL }}"
          baton-principal-type: 'user'
  test-admin:
    needs: [test-member]
    runs-on: ubuntu-latest
    env:
      BATON_LOG_LEVEL: debug
      BATON_TOKEN: "${{ secrets.BATON_TOKEN }}"
      BATON_ENTERPRISE_TOKEN: "${{ secrets.BATON_ENTERPRISE_TOKEN }}"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build baton-slack-enterprise
        run: go build ./cmd/baton-slack-enterprise
      - name: Test admin workspace role sync and provisioning
        uses: ConductorOne/github-workflows/actions/sync-test@v4
        with:
          connector: ./baton-slack-enterprise
          baton-entitlement: "${{ vars.WORKSPACE_ROLE_ADMIN_ENTITLEMENT }}"
          baton-principal: "${{ vars.WORKSPACE_ROLE_ADMIN_PRINCIPAL }}"
          baton-principal-type: 'user'
  test-owner:
    needs: [test-member, test-admin]
    runs-on: ubuntu-latest
    env:
      BATON_LOG_LEVEL: debug
      BATON_TOKEN: "${{ secrets.BATON_TOKEN }}"
      BATON_ENTERPRISE_TOKEN: "${{ secrets.BATON_ENTERPRISE_TOKEN }}"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build baton-slack-enterprise
        run: go build ./cmd/baton-slack-enterprise
      - name: Test owner workspace role sync and provisioning
        uses: ConductorOne/github-workflows/actions/sync-test@v4
        with:
          connector: ./baton-slack-enterprise
          baton-entitlement: "${{ vars.WORKSPACE_ROLE_OWNER_ENTITLEMENT }}"
          baton-principal: "${{ vars.WORKSPACE_ROLE_OWNER_PRINCIPAL }}"
          baton-principal-type: 'user'
  test-enterprise-roles:
    runs-on: ubuntu-latest
    env:
      BATON_LOG_LEVEL: debug
      BATON_TOKEN: "${{ secrets.BATON_TOKEN }}"
      BATON_ENTERPRISE_TOKEN: "${{ secrets.BATON_ENTERPRISE_TOKEN }}"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build baton-slack-enterprise
        run: go build ./cmd/baton-slack-enterprise
      - name: Test enterprise role sync and provisioning
        uses: ConductorOne/github-workflows/actions/sync-test@v4
        with:
          connector: ./baton-slack-enterprise
          baton-entitlement: "${{ vars.ENTERPRISE_ROLE_ENTITLEMENT }}"
          baton-principal: "${{ vars.ENTERPRISE_ROLE_PRINCIPAL }}"
          baton-principal-type: 'user'
